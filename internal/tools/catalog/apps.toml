# Devpit install catalog.
#
# Each [[app]] entry lists the identifiers used by the three managers Devpit
# drives (Scoop, winget, Chocolatey). A blank id means "not verified"; Devpit
# never guesses an id it isn't sure of, since installing the wrong package is
# worse than not offering it. `detect` lists the executable name(s) checked
# to decide whether the app already appears to be installed.

[[app]]
name = "Node.js LTS"
category = "Runtimes"
scoop = "nodejs-lts"
winget = "OpenJS.NodeJS.LTS"
choco = "nodejs-lts"
detect = ["node.exe"]
description = "JavaScript runtime, current LTS release."

[[app]]
name = "Python"
category = "Runtimes"
scoop = "python"
winget = "Python.Python.3.12"
choco = "python"
detect = ["python.exe"]
description = "Python interpreter and pip."

[[app]]
name = "Go"
category = "Runtimes"
