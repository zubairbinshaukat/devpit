name: CI

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: "1.26"

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the target platform. Ubuntu proves the platform stubs
        # keep the pure-logic packages portable.
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Vet the Windows files from Linux
        if: runner.os == 'Linux'
        run: GOOS=windows go vet ./...

      - name: Test
        run: go test -count=1 ./...

      - name: Test with the race detector
        if: runner.os == 'Linux'
        run: go test -race -count=1 ./...

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: Check the module is tidy
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
          args: --timeout=5m

      # The Windows-only files are excluded from the Linux lint run above, so
      # lint them explicitly with the Windows build tags too.
      - name: Lint the Windows build
        uses: golangci/golangci-lint-action@v9
        env:
          GOOS: windows
        with:
          version: v2.13.2
          args: --timeout=5m

  vulncheck:
    name: govulncheck (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: true

      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  # The docs site (web/docs-site, served at /docs) is built exactly the way
  # Vercel builds it, then checked: links, meta tags, JSON-LD, sitemap, llms.txt.
  # The Go job above already fails when the generated Command line page is stale.
  docs:
    name: Docs site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/docs-site/package-lock.json

      - name: Install
        run: npm ci --prefix web/docs-site

      - name: Build the site
        run: node web/scripts/build.mjs

      - name: Check the site
        run: npm --prefix web/docs-site run check
