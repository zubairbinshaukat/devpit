name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  release:
    name: GoReleaser
    runs-on: ubuntu-latest
    permissions:
      # Publish the release and its assets.
      contents: write
      # Mint the build provenance attestation.
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-go@v6
        with:
          go-version: "1.26"
          check-latest: true

      - name: Verify the module
        run: |
          go mod verify
          go build ./...

      - name: Test before releasing
        run: go test -count=1 ./...

      # GoReleaser shells out to syft for the SBOMs, and the runner does not
      # ship it.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@v0

      - uses: goreleaser/goreleaser-action@v6
        id: goreleaser
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Token with write access to the scoop bucket repository. The
          # template in .goreleaser.yml fails the release if this secret is
          # unset, so create the bucket and the secret before the first tag.
          # See docs/releasing.md.
          SCOOP_BUCKET_TOKEN: ${{ secrets.SCOOP_BUCKET_TOKEN }}

      - name: Attest build provenance
        uses: actions/attest-build-provenance@v3
        with:
          subject-path: |
            dist/*.zip
            dist/checksums.txt
